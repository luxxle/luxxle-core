<style include="settings-shared">
</style>
<settings-animated-pages id="pages" section="luxxleSync">
  <div route-path="default">
    <cr-link-row id="luxxle-sync-setup"
      label$="[[syncLabel_]]"
      on-click="onSyncTap_"
      role-description="$i18n{subpageArrowRoleDescription}">
    </cr-link-row>
  </div>

  <template is="dom-if" route-path="/luxxleSync/setup">
    <settings-subpage
      associated-control="[[$$('#luxxle-sync-setup')]]"
      page-title="[[syncLabel_]]">
      <settings-luxxle-sync-subpage
          sync-status="[[syncStatus_]]">
      </settings-luxxle-sync-subpage>
    </settings-subpage>

  </template>
</settings-animated-pages>
