<settings-toggle-button class="cr-row hr"
  pref="{{prefs.luxxle.playlist.enabled}}"
  label="$i18n{luxxlePlaylistEnablePlaylistLabel}">
</settings-toggle-button>
<template
  is="dom-if"
  if="[[prefs.luxxle.playlist.enabled.value]]">
  <div class="cr-row continuation list-frame">
    <settings-toggle-button
      class="list-item"
      pref="{{prefs.luxxle.playlist.cache}}"
      label="$i18n{luxxlePlaylistCacheByDefaultLabel}"
      sub-label="$i18n{luxxlePlaylistCacheByDefaultSubLabel}"
    >
    </settings-toggle-button>
  </div>
</template> <!-- playlist.enabled.value -->
